[package]
name = "ae3-core"
description = "Fetching, parsing, decoding and export logic shared by the AE3 binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ae3-audio.workspace = true
ae3-image.workspace = true
ae3-unity.workspace = true
# Pure-Rust Brotli decoding for the community gamedata files; std only.
brotli-decompressor = { version = "6.0", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Parse and write only; no preserve_order, no debug.
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }
ureq.workspace = true

[dev-dependencies]
# Only to parse and validate the glb files the tests write; never linked
# into the binaries.
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }

[lints]
workspace = true
