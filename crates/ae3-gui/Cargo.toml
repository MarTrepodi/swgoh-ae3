[package]
name = "ae3-gui"
description = "Graphical SWGOH asset extractor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ae3-core.workspace = true
# glow (OpenGL) instead of the wgpu default, per ADR-0002.
eframe = { workspace = true, features = [
    "accesskit",
    "clipboard",
    "glow",
    "wayland",
    "x11",
] }
# Hack, egui's monospace font, for paths and code. eframe's `default_fonts`
# is off: it would also embed Ubuntu Light, which the theme replaces with
# Ubuntu Regular and Medium (assets/fonts/, src/ui/theme.rs).
epaint_default_fonts = "0.37"
# Phosphor icons (regular), as a compile-time subset of the icons the window
# uses (src/ui/icons.rs). 0.14 targets egui 0.36; only its codepoints, font
# and const subsetter are used, so none of that egui is linked.
egui-phosphor = { version = "0.14", default-features = false, features = ["subset"] }
# Only the table widget; no image loaders, no mime guessing.
egui_extras = { version = "0.37", default-features = false }
# Decodes the embedded application icon; the same png that ae3-image uses.
png = { version = "0.18.1", default-features = false }
# Native folder picker. The xdg-portal backend talks D-Bus on Linux, so no
# GTK is linked; macOS and Windows use the system dialogs.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Sound playback through cpal, without rodio's decoders: ae3-audio decodes
# to PCM. On Linux cpal links ALSA (libasound.so.2), so building needs its
# headers (libasound2-dev); cpal has no dlopen option.
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# Reading GitHub's release answer and the saved release-check state; both
# are already built for ae3-core.
serde.workspace = true
serde_json.workspace = true

# eframe's `wayland` feature does not enable winit's dlopen loading, which would
# link libwayland at build time. Feature unification switches winit and glutin
# to dlopen, so the binary still starts on X11-only systems. Client-side
# decorations give the window a title bar on GNOME/Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = [
    "wayland-csd-adwaita",
    "wayland-dlopen",
] }

# The workspace lints, except that unsafe code is denied rather than
# forbidden: the 3D Mesh view (src/ui/mesh.rs) calls OpenGL through glow,
# whose bindings are all `unsafe`, and allows it in that module alone.
# Windows only: embeds the icon and version info in ae3-gui.exe (build.rs).
# Build scripts run on the build machine, which is Windows for the Windows
# release; no other build compiles it.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# cargo-dist builds the Windows and Linux archives; macOS gets AE3.app from
# .github/workflows/macos-app.yml. Paths are relative to this file. dist has
# no per-target include, so the Windows zip carries the .desktop file too.
[package.metadata.dist]
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
include = [
    "../../LICENSE",
    "../../README.md",
    "../../CHANGELOG.md",
    "../ae3-audio/THIRD-PARTY-NOTICES.md",
    "FONT-NOTICES.md",
    "../../THIRD-PARTY-LICENSES.md",
    "../../packaging/linux/ae3-gui.desktop",
    "../../packaging/icons/swgoh-ae3.png",
]

# The Linux release runners install ALSA's headers for cpal (see rodio above).
[package.metadata.dist.dependencies.apt]
libasound2-dev = "*"
