# release-plz: on every push to main, .github/workflows/release-plz.yml
# opens (or updates) a release PR that bumps the shared workspace version and
# writes CHANGELOG.md from conventional commits. Merging that PR pushes a
# `vX.Y.Z` tag, which starts cargo-dist's release.yml. Nothing is published
# to crates.io, and dist, not release-plz, creates the GitHub Release.
[workspace]
# Versions come from the vX.Y.Z git tags, not a registry.
git_only = true
# No repo_url: release-plz takes the repository from the git remote, so it
# follows the repository wherever it lives. A fixed URL broke tagging: the
# release step (unlike release-pr, which the action gives the real URL)
# looks up the merged release PR in repo_url, and a repository that does
# not exist there has no such PR, so no tag was ever created.
git_tag_name = "v{{ version }}"
# Only the ae3 package below tags; one tag releases every binary.
git_tag_enable = false
git_release_enable = false
changelog_update = false
# Release only when the release PR is merged, not on every push.
release_always = false
semver_check = false
dependencies_update = false
pr_labels = ["release"]

# All crates share [workspace.package] version and move together.
[[package]]
name = "ae3"
version_group = "ae3"
git_tag_enable = true
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["ae3-audio", "ae3-core", "ae3-gui", "ae3-image", "ae3-unity"]

[[package]]
name = "ae3-gui"
version_group = "ae3"

[[package]]
name = "ae3-core"
version_group = "ae3"

[[package]]
name = "ae3-unity"
version_group = "ae3"

[[package]]
name = "ae3-image"
version_group = "ae3"

[[package]]
name = "ae3-audio"
version_group = "ae3"

# Development-only crates: never released, tagged or written to the
# changelog. release = false alone is not enough: release-plz still works
# out every crate's version, finds the shared vX.Y.Z tag through the
# workspace git_tag_name and looks the crate up in that tag's tree, which
# fails for a crate added after the last release. A tag name of their own,
# which is never created, makes release-plz treat them as unreleased.
[[package]]
name = "ae3-oracle"
release = false
git_tag_name = "ae3-oracle-v{{ version }}"

[[package]]
name = "ae3-gui-tests"
release = false
git_tag_name = "ae3-gui-tests-v{{ version }}"

[changelog]
# Commits follow Conventional Commits, `type(scope): summary`, with crate
# (core, unity, image, audio, cli, gui) or area (ci, release, readme) scopes.
# Chores, CI, build, test and style commits stay out of the changelog.
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs", group = "Documentation" },
    { message = "^revert", group = "Reverted" },
    { message = "^(chore|ci|build|test|style)", skip = true },
    # Merge commits repeat the commits they merge.
    { message = "^Merge ", skip = true },
    # Fallbacks for a summary that does not follow the convention, so a
    # slip still lands in a sensible group instead of being dropped.
    { message = "^(Add|Scaffold)\\b", group = "Added" },
    { message = "^Fix\\b", group = "Fixed" },
    { message = ".*", group = "Changed" },
]
