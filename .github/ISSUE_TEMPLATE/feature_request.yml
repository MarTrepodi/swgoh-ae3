name: Feature request
description: Suggest a new capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like AE3 to do?
      description: The behaviour you have in mind, for the CLI, the GUI or both.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Downloading and Asset Versions
        - Search
        - Preview (GUI)
        - Export formats
        - Sprites and Atlases
        - Audio
        - Meshes
        - Diff
        - HTTP API (ae3 serve)
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
