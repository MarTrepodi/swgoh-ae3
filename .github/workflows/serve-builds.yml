# Builds of the ae3 CLI with the HTTP API (`ae3 serve`), ae3-serve-<target>
# beside the plain ae3-<target> archives, in two ways:
#
# - On demand (Run workflow in the Actions tab): from the branch it runs on,
#   or from `ref`, such as a release tag. Each archive is uploaded as a
#   workflow artifact, ae3-serve-<target>, and kept `retention-days`.
# - In a release: release.yml calls it as a cargo-dist custom job
#   (local-artifacts-jobs in Cargo.toml), like macos-app.yml. The uploads are
#   named artifacts-serve-<target>, so the release attaches them, and
#   scripts/add-custom-downloads.sh lists them in the release notes. It
#   leaves out macOS there: macos-app.yml packs that archive on the macOS
#   runner the release already starts.
#
# The builds match release.yml's: the dist profile, the same native runners
# (Ubuntu 22.04 keeps the glibc floor at 2.35), and the same files beside the
# binary. THIRD-PARTY-LICENSES.md is generated with the serve feature on, so
# it covers tiny_http, which the release graph does not include.
name: HTTP API builds

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (empty for the one this runs on)
        type: string
        default: ""
      retention-days:
        description: Days to keep the archives
        type: number
        default: 14
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ae3 serve (${{ fromJSON('{"x86_64-pc-windows-msvc":"Windows x86_64","aarch64-apple-darwin":"macOS arm64","x86_64-unknown-linux-gnu":"Linux x86_64","aarch64-unknown-linux-gnu":"Linux aarch64"}')[matrix.target] }})
    runs-on: ${{ fromJSON('{"x86_64-pc-windows-msvc":"windows-2022","aarch64-apple-darwin":"macos-14","x86_64-unknown-linux-gnu":"ubuntu-22.04","aarch64-unknown-linux-gnu":"ubuntu-22.04-arm"}')[matrix.target] }}
    strategy:
      fail-fast: false
      # Runners and names are looked up by target rather than listed under
      # include: GitHub adds an include entry back as a job of its own when
      # exclude has removed the combination it would extend.
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        mode:
          - ${{ inputs.plan && 'release' || 'on-demand' }}
        exclude:
          - target: aarch64-apple-darwin
            mode: release
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: ae3-serve-${{ matrix.target }}
      EXE: ${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      # A release builds its own tag; `ref` is only set on demand.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Generate THIRD-PARTY-LICENSES.md
        run: |
          cargo fetch --locked
          cargo about generate --workspace --features ae3/serve --frozen --fail -c packaging/about.toml -o THIRD-PARTY-LICENSES.md packaging/about.hbs

      - name: Build ae3 with the serve feature
        run: cargo build --profile dist --locked -p ae3 --features serve --target ${{ matrix.target }}

      # Every runner is native, so the binary can run here: the build must
      # have the serve command, or the archive is useless.
      - name: Check the binary serves
        run: |
          bin=target/${{ matrix.target }}/dist/ae3$EXE
          "$bin" --version
          "$bin" serve --help > /dev/null

      # The layout release.yml's archives use: a zip with the files at its
      # root on Windows, else a .tar.xz holding one top-level folder.
      - name: Pack ${{ env.ARCHIVE }}
        run: |
          stage="$RUNNER_TEMP/stage/$ARCHIVE"
          out="$GITHUB_WORKSPACE/target/distrib"
          mkdir -p "$stage" "$out"
          cp "target/${{ matrix.target }}/dist/ae3$EXE" "$stage/"
          cp LICENSE README.md CHANGELOG.md THIRD-PARTY-LICENSES.md \
            crates/ae3-audio/THIRD-PARTY-NOTICES.md "$stage/"
          # No builder's user name in the archive; on macOS (bsdtar), no
          # extended attributes or resource forks either.
          case "$RUNNER_OS" in
            Windows)
              file="$ARCHIVE.zip"
              (cd "$stage" && 7z a -tzip -bso0 "$out/$file" .) ;;
            macOS)
              file="$ARCHIVE.tar.xz"
              (cd "$RUNNER_TEMP/stage" && COPYFILE_DISABLE=1 tar --no-xattrs --uid 0 --gid 0 --uname "" --gname "" -cJf "$out/$file" "$ARCHIVE") ;;
            *)
              file="$ARCHIVE.tar.xz"
              (cd "$RUNNER_TEMP/stage" && tar --owner 0 --group 0 --numeric-owner -cJf "$out/$file" "$ARCHIVE") ;;
          esac
          cd "$out"
          if command -v sha256sum > /dev/null; then
            sha256sum -b "$file" > "$file.sha256"
          else
            shasum -a 256 -b "$file" > "$file.sha256"
          fi
          {
            echo "### ${{ matrix.target }}"
            echo
            echo "\`$file\` ($(du -h "$file" | cut -f1)), $("$GITHUB_WORKSPACE/target/${{ matrix.target }}/dist/ae3$EXE" --version), commit \`$(git -C "$GITHUB_WORKSPACE" rev-parse --short=7 HEAD)\`"
            echo
            echo "\`\`\`text"
            cat "$file.sha256"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # In a release (plan is set), the artifacts-* name is what release.yml
      # collects and attaches to the GitHub Release.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.plan && format('artifacts-serve-{0}', matrix.target) || env.ARCHIVE }}
          path: target/distrib/${{ env.ARCHIVE }}.*
          retention-days: ${{ inputs.retention-days || 14 }}
          if-no-files-found: error
