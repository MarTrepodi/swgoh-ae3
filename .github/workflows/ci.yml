name: CI

# The fast gate every pull request must pass: commit messages, formatting,
# and clippy plus the test suite on Linux x86_64. Builds for the other
# platforms, release builds and size budgets run in full.yml (nightly, on
# release PRs, and on PRs labelled full-ci).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fixture tests read the game data fetched by scripts/fetch-fixtures.sh
  # from here; after the fetch, a missing fixture fails instead of skipping.
  AE3_FIXTURES: ${{ github.workspace }}/fixtures
  AE3_REQUIRE_FIXTURES: "1"

jobs:
  # Decides whether the Rust jobs run. A pull request that only touches
  # documentation skips them. Skipping inside the jobs (rather than with
  # paths-ignore) matters: a skipped job satisfies a required status check,
  # while a workflow that never starts leaves the check pending forever.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              *.md | LICENSE | .github/ISSUE_TEMPLATE/*) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  # Conventional Commits, checked by committed against committed.toml.
  # release-plz builds the changelog and next version from these messages.
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: crate-ci/committed@v1.1.11

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Installs the channel and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  check:
    name: Check (Linux x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # ae3-gui plays sounds through cpal, which links ALSA on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev

      # Fixtures are game data and never committed. The cache key is the
      # script itself, which holds the pinned list and its checksums.
      - name: Cache fixtures
        uses: actions/cache@v5
        with:
          path: fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('scripts/fetch-fixtures.sh') }}
      - name: Fetch fixtures
        run: bash scripts/fetch-fixtures.sh

      # ae3-oracle's `oracle` feature links C zstd, so --all-features leaves
      # that crate out; full.yml runs the oracle itself.
      - name: Clippy
        run: |
          cargo clippy --workspace --exclude ae3-oracle --all-targets --all-features --locked -- -D warnings
          cargo clippy -p ae3-oracle --all-targets --locked -- -D warnings

      - name: Test
        run: |
          cargo test --workspace --exclude ae3-oracle --all-features --locked
          cargo test -p ae3-oracle --locked

  # The single check branch protection requires. It passes when every job
  # above passed or was skipped (documentation-only pull requests).
  result:
    name: CI result
    if: always()
    needs: [changes, commits, fmt, check]
    runs-on: ubuntu-24.04
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "::error::A CI job failed or was cancelled."
            exit 1
          fi
