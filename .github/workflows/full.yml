name: Full CI

# Every platform, release builds, binary size budgets, the texture oracle
# and the UI tests (ui.yml: interaction and snapshot tests, plus an
# end-to-end smoke run of each platform's release ae3-gui binary built
# here). Too slow, and on macOS and Windows too costly, for every push, so
# it builds each version of the code once (scripts/full-ci-needed.sh):
#   - nightly, when main has code no earlier full run built;
#   - on release-plz's release pull request, unless a passing run already
#     built its code (a release is main plus a version bump), so nothing
#     ships untested;
#   - once each time a pull request is labelled full-ci: the run removes
#     the label, so later pushes (Auto-fix's too) do not rebuild; label it
#     again for another run;
#   - on demand (workflow_dispatch).
# A failing nightly run opens (or comments on) a nightly-failure issue; the
# next passing one closes it.
on:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# A run the full-ci label asked for has a group of its own: a later push to
# the pull request must not cancel it, since that push's run will not build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'push' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  AE3_FIXTURES: ${{ github.workspace }}/fixtures
  AE3_REQUIRE_FIXTURES: "1"

jobs:
  # Decides whether the expensive jobs run. When they are skipped they still
  # satisfy required status checks, so ordinary pull requests are not held.
  gate:
    name: Full CI gate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write # to remove the full-ci label
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # The nightly and release pull requests compare the code with what
      # earlier runs built.
      - if: github.event_name == 'schedule' || startsWith(github.head_ref, 'release-plz-')
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=false
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) run=true ;;
            pull_request)
              if [[ "$ACTION" == labeled && "$LABEL" == full-ci ]]; then
                run=true
                # One run per labelling. A fork's token may not edit labels;
                # the run goes ahead regardless.
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/full-ci" >/dev/null ||
                  echo "::warning::Could not remove the full-ci label."
              elif [[ "$HEAD_REF" == release-plz-* ]]; then
                run=$(bash scripts/full-ci-needed.sh --passed "$HEAD_SHA")
              fi
              ;;
            # Only code nothing has built yet: not docs, workflows or a
            # release merge its release pull request already built. A run
            # that failed counts as built: retry a flaky failure with
            # "Re-run failed jobs", which also reruns the report.
            schedule) run=$(bash scripts/full-ci-needed.sh "$GITHUB_SHA") ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Run full CI: $run"

  build:
    name: Full (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        # gui_budget is ae3-gui's size budget in MiB. It differs by platform:
        # macOS draws through system frameworks, while Windows and Linux link
        # their own accessibility, windowing and clipboard stacks (Linux:
        # AT-SPI over zbus, X11, Wayland and client-side decorations), and
        # x86_64 code is larger than aarch64. First CI measurements:
        # macOS 5.9, Windows 9.6, Linux aarch64 9.6, Linux x86_64 12.8 MiB.
        # slug names the ae3-gui-<slug> artifact the UI tests run.
        include:
          - name: Windows x86_64
            slug: windows-x86_64
            os: windows-latest
            gui_budget: 11
          - name: macOS arm64
            slug: macos-arm64
            os: macos-latest
            gui_budget: 8
          - name: Linux x86_64
            slug: linux-x86_64
            os: ubuntu-24.04
            gui_budget: 14
          - name: Linux aarch64
            slug: linux-aarch64
            os: ubuntu-24.04-arm
            gui_budget: 11
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF endings so scripts/fetch-fixtures.sh runs under Git Bash.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # ae3-gui plays sounds through cpal, which links ALSA on Linux and
      # needs its headers (alsa.pc) to build.
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Cache fixtures
        uses: actions/cache@v5
        with:
          path: fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('scripts/fetch-fixtures.sh') }}
      - name: Fetch fixtures
        shell: bash
        run: bash scripts/fetch-fixtures.sh

      # Bash, so the first command's failure is not lost on Windows, where
      # PowerShell would only report the last one. ae3-gui-tests' snapshots
      # feature needs a GPU, so --all-features leaves that crate out of the
      # tests: its default interaction tests run here and the snapshots run
      # on lavapipe in ui.yml. Clippy still checks it with every feature.
      - name: Clippy
        shell: bash
        run: |
          cargo clippy --workspace --exclude ae3-oracle --exclude ae3-gui-tests --all-targets --all-features --locked -- -D warnings
          cargo clippy -p ae3-oracle --all-targets --locked -- -D warnings
          cargo clippy -p ae3-gui-tests --all-targets --all-features --locked -- -D warnings

      - name: Test
        shell: bash
        run: |
          cargo test --workspace --exclude ae3-oracle --exclude ae3-gui-tests --all-features --locked
          cargo test -p ae3-oracle --locked
          cargo test -p ae3-gui-tests --locked

      # ae3-gui-tests is left out so its dependencies' features cannot
      # unify into the shipped binaries measured below.
      - name: Release build
        run: cargo build --workspace --exclude ae3-oracle --exclude ae3-gui-tests --release --locked

      # The binary ui.yml's end-to-end job runs on this platform.
      - name: Upload ae3-gui
        uses: actions/upload-artifact@v7
        with:
          name: ae3-gui-${{ matrix.slug }}
          path: target/release/ae3-gui${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

      # Budgets are in MiB and apply to the default-feature release binaries:
      # 5 for ae3 everywhere, and matrix.gui_budget for ae3-gui.
      - name: Binary size budget
        shell: bash
        run: |
          ext=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then ext=".exe"; fi
          echo "| Binary | Bytes | Budget |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: | ---: |" >> "$GITHUB_STEP_SUMMARY"
          status=0
          check() {
            local bin="$1" budget=$(( $2 * 1024 * 1024 )) size
            size=$(wc -c < "target/release/$bin$ext" | tr -d '[:space:]')
            echo "$bin$ext: $size bytes (budget $budget)"
            echo "| $bin$ext | $size | $budget |" >> "$GITHUB_STEP_SUMMARY"
            if (( size > budget )); then
              echo "::error::$bin$ext is $size bytes, over its $2 MiB budget"
              status=1
            fi
          }
          check ae3 5
          check ae3-gui ${{ matrix.gui_budget }}
          exit $status

  # The differential oracle: every fixture texture decoded by ae3-core and
  # by unity-rs-core must agree. unity-rs-core links C zstd, which is why it
  # lives in this job and never in a shipped binary.
  oracle:
    name: Full (texture oracle)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache fixtures
        uses: actions/cache@v5
        with:
          path: fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('scripts/fetch-fixtures.sh') }}
      - name: Fetch fixtures
        run: bash scripts/fetch-fixtures.sh

      - name: Shipped binaries do not depend on the oracle
        run: |
          for dep in unity-rs-core zstd-sys; do
            if cargo tree --locked -p ae3 -p ae3-gui --all-features --target all -e normal,build -i "$dep" >/dev/null 2>&1; then
              echo "::error::ae3 or ae3-gui depends on $dep"
              exit 1
            fi
          done

      - name: Clippy
        run: cargo clippy -p ae3-oracle --all-targets --all-features --locked -- -D warnings

      - name: Oracle
        run: cargo test -p ae3-oracle --all-features --locked -- --include-ignored --nocapture

  # UI tests on the binaries the build matrix uploaded; only when every
  # platform built, since the end-to-end matrix needs all four.
  ui:
    name: UI
    needs: [gate, build]
    if: needs.gate.outputs.run == 'true' && needs.build.result == 'success'
    uses: ./.github/workflows/ui.yml
    with:
      build: false

  # The single check branch protection requires. Skipped jobs pass it, so
  # ordinary pull requests are not held; on release-plz's release pull
  # request and full-ci pull requests every platform must pass. Requiring the
  # matrix jobs directly would not work: when skipped, they report under
  # their unexpanded name and the required check would never arrive.
  result:
    name: Full CI result
    # !cancelled(), not always(): a run superseded by a newer one on the
    # same ref (concurrency) is cancelled as a whole, and its result must not
    # post a failure next to the live run's. A job that fails or times out
    # inside a live run still fails this one.
    if: ${{ !cancelled() }}
    needs: [gate, build, oracle, ui]
    runs-on: ubuntu-24.04
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "::error::A full CI job failed or was cancelled."
            exit 1
          fi

  # Nightly runs have no pull request to show their result, so a failure
  # opens a nightly-failure issue (or comments on the open one) listing the
  # failed jobs, and the next passing run closes it. Runs the gate skipped
  # (no new code) tested nothing and report nothing.
  report:
    name: Nightly report
    if: always() && github.event_name == 'schedule' && (needs.gate.result != 'success' || needs.gate.outputs.run == 'true')
    needs: [gate, result]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.result.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=nightly-failure
          gh label create "$label" --color B60205 \
            --description "The nightly full CI run is failing" --force
          open=$(gh issue list --label "$label" --state open --json number --jq '.[].number')

          if [[ "$RESULT" == "success" ]]; then
            for issue in $open; do
              gh issue close "$issue" --comment "Nightly full CI passes again: $RUN_URL"
            done
            exit 0
          fi

          failed=$(gh api --paginate \
            "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[]
              | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
              | select(.name != "Full CI result")
              | "- \(.name) (\(.conclusion))"')
          body=$RUNNER_TEMP/body.md
          {
            echo "Nightly full CI failed on \`$GITHUB_SHA\`: $RUN_URL"
            echo
            echo "Failed jobs:"
            echo
            echo "${failed:-- none recorded; see the run}"
          } > "$body"

          first=${open%%[[:space:]]*}
          if [[ -n "$first" ]]; then
            gh issue comment "$first" --body-file "$body"
          else
            gh issue create --title "Nightly full CI is failing" --label "$label" --body-file "$body"
          fi
