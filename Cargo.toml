[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/swgoh-utils/swgoh-ae3"

[workspace.dependencies]
ae3-audio = { path = "crates/ae3-audio" }
ae3-core = { path = "crates/ae3-core" }
ae3-image = { path = "crates/ae3-image" }
ae3-unity = { path = "crates/ae3-unity" }
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

# ae3-gui repeats these with unsafe_code = "deny" for its OpenGL module;
# keep its [lints] in step.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# Release builds are tuned for binary size; the native binaries are the product.
# opt-level measured on macOS arm64 with the rest of this profile (bytes):
#   opt-level   ae3         ae3-gui
#   3           1,811,440   4,188,528
#   2           1,745,392   3,973,872
#   "s"         1,514,512   3,413,120
#   "z"         1,352,288   2,974,832
# If a CPU-bound decoder crate turns out slow at "z", give that crate a
# `[profile.release.package.<name>] opt-level = 3` override, not the workspace.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
# Unwind, not abort: a crafted Crunch texture can still panic texture2ddecoder
# (see ae3-image), and ae3_core::guard contains such a panic to one Asset,
# sound or Package. Cost measured on macOS arm64 against panic = "abort":
#   ae3 2,400,096 -> 2,715,248; ae3 --features serve 2,484,288 -> 2,832,656;
#   ae3-gui 5,090,128 -> 5,637,456 bytes.
panic = "unwind"

# Release archives are built by cargo-dist from the same tuned profile.
[profile.dist]
inherits = "release"

# cargo-dist: `dist plan` checks this config, `dist generate` rewrites
# .github/workflows/release.yml from it (never edit that file by hand).
# One archive per binary per target. The macOS GUI is not in this list: the
# macos-app custom job bundles it as AE3.app instead.
[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = []
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Archives carry exactly these files next to the binaries.
# THIRD-PARTY-LICENSES.md is generated by .github/build-setup.yml.
auto-includes = false
include = [
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "crates/ae3-audio/THIRD-PARTY-NOTICES.md",
    "THIRD-PARTY-LICENSES.md",
]
github-build-setup = "../build-setup.yml"
local-artifacts-jobs = ["./macos-app"]
pr-run-mode = "plan"
install-updater = false

# Native runners. Ubuntu 22.04 keeps the glibc floor at 2.35.
[workspace.metadata.dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-pc-windows-msvc = "windows-2022"
